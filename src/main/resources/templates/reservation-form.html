<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${reservation.id} != null ? 'Uredi rezervaciju' : 'Nova rezervacija'">Nova rezervacija</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="navbar">
    <a class="brand" href="/">SmartReservation</a>
    <div class="nav-links">
        <a href="/reservations">Rezervacije</a>
        <a href="/reservation">Nova rezervacija</a>
    </div>
</nav>

<div class="page">
    <h1 th:text="${reservation.id} != null ? 'Uredi rezervaciju' : 'Nova rezervacija'">Nova rezervacija</h1>
    <p class="subtitle" th:text="${reservation.id} != null ? 'Ažurirajte podatke o postojećoj rezervaciji.' : 'Unesite podatke za novu rezervaciju stola.'">
        Unesite podatke za novu rezervaciju stola.
    </p>

    <div class="card">
        <form th:action="@{/saveReservation}" th:object="${reservation}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label>Ime gosta</label>
                <input type="text" th:field="*{customerName}" placeholder="npr. Ana Anić">
                <span class="error" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></span>
            </div>

            <div class="form-group">
                <label>Broj stola</label>
                <input type="number" th:field="*{tableNumber}" placeholder="npr. 4">
                <span class="error" th:if="${#fields.hasErrors('tableNumber')}" th:errors="*{tableNumber}"></span>
            </div>

            <div class="form-group">
                <label>Datum</label>
                <input type="date" th:field="*{reservationDate}">
                <span class="error" th:if="${#fields.hasErrors('reservationDate')}" th:errors="*{reservationDate}"></span>
            </div>

            <div class="form-group">
                <label>Vrijeme</label>
                <input type="time" th:field="*{reservationTime}">
                <span class="error" th:if="${#fields.hasErrors('reservationTime')}" th:errors="*{reservationTime}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn" th:text="${reservation.id} != null ? 'Spremi izmjene' : 'Spremi rezervaciju'">Spremi rezervaciju</button>
                <a class="btn btn-secondary" href="/reservations">Odustani</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>
